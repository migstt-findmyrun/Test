openapi: 3.0.3
info:
  title: iOFFICE Service Requests
  description: >
    The parts of the iOFFICE REST API that the Copilot agent calls directly.
    Copilot sends the iOFFICE API key/secret from its secure vault, so no
    separate server is needed.

    TODO: every item marked "TODO" is a placeholder. Check it against the
    iOFFICE REST API documentation for your instance before using the agent.
  version: 1.0.0
servers:
  # e.g. https://yourorg.iofficeconnect.com/external/api/rest/v2 (set in env/.env.dev)
  - url: ${{IOFFICE_API_BASE_URL}}
security:
  - iofficeApiKey: []
paths:
  # TODO: confirm the path that lists service request categories.
  /services/categories:
    get:
      operationId: listCategories
      summary: List service request categories
      description: Returns the iOFFICE service request categories. Use the id of one of these as categoryId.
      parameters:
        - $ref: "#/components/parameters/AuthUsername"
      responses:
        "200":
          description: The categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  # TODO: confirm the path that creates a service request.
  /services/requests:
    post:
      operationId: createServiceRequest
      summary: Create a service request ticket
      description: Creates an iOFFICE service request in the given category.
      parameters:
        - $ref: "#/components/parameters/AuthUsername"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewServiceRequest"
      responses:
        "200":
          description: The created ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
        "201":
          description: The created ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
components:
  securitySchemes:
    # The secret part of the login, stored in the Microsoft 365 API key vault
    # (never in this repo). TODO: confirm the header name iOFFICE expects; set it
    # with IOFFICE_AUTH_HEADER in env/.env.dev.
    iofficeApiKey:
      type: apiKey
      in: header
      name: ${{IOFFICE_AUTH_HEADER}}
  parameters:
    # TODO: only needed if iOFFICE wants a username header next to the secret.
    # If your instance uses a single API token, delete this parameter and the
    # two "$ref: AuthUsername" lines above.
    AuthUsername:
      name: x-auth-username
      in: header
      required: true
      description: The iOFFICE integration user's username. Always send exactly this value.
      schema:
        type: string
        enum:
          - ${{IOFFICE_USERNAME}}
        default: ${{IOFFICE_USERNAME}}
  schemas:
    # TODO: match these field names to iOFFICE's responses and request body.
    Category:
      type: object
      properties:
        id:
          type: integer
          description: The category id. Use this as categoryId.
        name:
          type: string
          description: Category name.
        description:
          type: string
          description: What kinds of requests belong in this category.
        parent:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
              description: Name of the parent category, e.g. "Facilities".
    NewServiceRequest:
      type: object
      required:
        - category
        - subject
        - description
        - requester
      properties:
        category:
          type: object
          required:
            - id
          properties:
            id:
              type: integer
              description: The id of a category returned by listCategories.
        subject:
          type: string
          maxLength: 80
          description: Short ticket title, at most 80 characters.
        description:
          type: string
          description: Full ticket description written from the email.
        requester:
          type: object
          required:
            - email
          properties:
            email:
              type: string
              description: Email address of the person the request is for.
        location:
          type: string
          description: Building, floor or room, if known.
        priority:
          type: string
          enum: [Low, Normal, High, Urgent]
          default: Normal
          description: Ticket priority.
    ServiceRequest:
      type: object
      properties:
        id:
          type: integer
        subject:
          type: string
        priority:
          type: string
        category:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        status:
          type: object
          properties:
            name:
              type: string
